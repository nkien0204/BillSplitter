# Render Blueprint: Dashboard > New > Blueprint > pick this repository.
# Creates the ChiaBill API as a free web service. Fill in the secrets marked
# sync: false when Render asks (see backend/DEPLOY.md).
services:
  - type: web
    name: chiabill-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev --omit=optional
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: chiabill
