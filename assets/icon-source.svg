<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- ChiaBill app icon master. Edit this, then regenerate the PNGs in assets/. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B4ECF3"/>
      <stop offset="1" stop-color="#6CCAD9"/>
    </linearGradient>
  </defs>
  <rect id="background" width="1024" height="1024" fill="url(#bg)"/>
  <g id="art" transform="translate(-19 0)" stroke="#1B3A6B" stroke-width="24" stroke-linejoin="round" stroke-linecap="round">
    <!-- card behind the bill -->
    <rect x="155" y="281" width="290" height="482" rx="44" fill="#5B7FD9"/>
    <path d="M195 340 H330" stroke="#9FB6F0" stroke-width="18"/>
    <!-- the bill, with its bottom-right share torn off -->
    <path d="M377 281 H869 V561 H678 V821 H377 Z" fill="#F7FAFC"/>
    <path d="M623 206 V316"/>
    <path d="M450 387 H780"/>
    <path d="M450 484 H520"/>
    <path d="M450 566 H580"/>
    <path d="M450 648 H520"/>
    <!-- the split-off share -->
    <rect x="708" y="597" width="200" height="150" rx="22" fill="#3FAFC6"/>
    <path d="M748 672 H868" stroke-width="18"/>
  </g>
</svg>
